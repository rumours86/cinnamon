name: Validate Mint 22 compatibility
on:
  push:
    branches: [ci-mint22-compat-checks]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Mint 22 X11
            version: mint22
            image: linuxmintd/mint22.3-amd64
            profiles: pkg.cinnamon.nowayland
          - name: LMDE 7 Wayland
            version: lmde7
            image: linuxmintd/lmde7-amd64
            profiles: ''
          - name: Mint 27 Wayland
            version: mint27
            image: linuxmintd/mint27-amd64
            profiles: ''
    container:
      image: ${{ matrix.image }}
      options: --security-opt seccomp=unconfined
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 2e92a9131a17bceb47ee7b85dc7cc4fb244ebccd
      - name: Verify source revision
        run: |
          chown root:root .
          test "$(git rev-parse HEAD)" = 2e92a9131a17bceb47ee7b85dc7cc4fb244ebccd
      - name: Update build environment
        run: |
          echo 'debconf debconf/frontend select Noninteractive' | debconf-set-selections
          apt-get update
          apt-get -y dist-upgrade
          apt-get install -y python-is-python3
      - uses: linuxmint/github-actions/install-deps@master
        with:
          mint_version: ${{ matrix.version }}
          dependencies: linuxmint/cinnamon-control-center, linuxmint/cinnamon-desktop, linuxmint/cinnamon-menus, linuxmint/cinnamon-session, linuxmint/cinnamon-settings-daemon, linuxmint/cinnamon-translations, linuxmint/cjs, linuxmint/muffin, linuxmint/nemo, linuxmint/xapp, linuxmint/xdg-desktop-portal-xapp
      - name: Build exact source with proposed action
        uses: rumours86/github-actions/real-build@d4c1e22b1939de2728f9f70eaaa6368600d64f92
        with:
          mint_version: ${{ matrix.version }}
      - name: Verify temporary sudo configuration was removed
        run: test ! -e /etc/sudoers.d/mint-build-profiles
